name: Update NFL Data & Elo

on:
  schedule:
    - cron: "0 9 * * 2"   # mardi 9h UTC, après le Monday Night Football
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nfl-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data pipeline
        run: python main.py --update

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ web/data/
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Auto: mise à jour des données NFL"
            git push
          fi

      - name: Trigger Vercel redeploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
