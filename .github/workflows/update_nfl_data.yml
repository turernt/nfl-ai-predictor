name: Update NFL Data & Elo

on:
  schedule:
    # GitHub démarre souvent les tâches programmées avec plusieurs heures de retard : les créneaux sont donc
    # nombreux et avancés. Les cotes restent en cache (data/odds_cache.json) et l'API n'est appelée qu'au besoin,
    # quel que soit le nombre de passages.
    - cron: "17 5,11,16,22 * * *"   # tous les jours
    - cron: "7 8,13,19 * * 0"       # dimanche, avant les matchs de 19 h, 22 h et 2 h 20 (heure de Paris)
    - cron: "37 15,19 * * 1,4"      # lundi et jeudi, avant les matchs du soir
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nfl-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for the next kickoff window
        run: |
          python -m src.wait_kickoff      # passage programmé : attend jusqu'à 75 min avant un match proche
          git fetch --depth=1 origin main && git reset --hard origin/main   # reprend la dernière version après l'attente

      - name: Run data pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}             # facultatif : cotes de plusieurs bookmakers
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }} # facultatif : alertes
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --update

      - name: Validate data
        run: python -m src.validate

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build website (check before publishing)
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ web/data/
          if git diff --staged --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Auto: mise à jour des données NFL"
          # Une modification faite à la main pendant le passage (ou l'attente) ne doit pas bloquer la publication
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1

      # Vercel redéploie déjà à chaque commit : pas de second déploiement par le hook

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=Arthur Analytics : la mise à jour a échoué, rien n'a été publié. ${RUN_URL}"
          fi
