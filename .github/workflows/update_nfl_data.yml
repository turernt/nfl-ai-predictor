name: Update NFL Data & Elo

on:
  schedule:
    - cron: "0 13 * * *"  # chaque jour à 13 h UTC : cotes, blessures et QB titulaires à jour avant les matchs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nfl-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}             # facultatif : cotes de plusieurs bookmakers
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }} # facultatif : alertes
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --update

      - name: Validate data
        run: python -m src.validate

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build website (check before publishing)
        working-directory: web
        run: npm install --no-audit --no-fund && npm run build

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ web/data/
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Auto: mise à jour des données NFL"
            git push
          fi

      - name: Trigger Vercel redeploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
